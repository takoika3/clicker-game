<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- ズーム無効化（iPad連打対策） -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Clicker Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 新規登録画面 -->
  <div id="signupScreen">
    <h2>新規アカウント作成</h2>
    <input id="newUser" placeholder="ユーザー名">
    <input id="newPass" type="password" placeholder="パスワード">
    <button id="signupBtn">アカウント作成</button>
    <p id="signupError" style="color:red;"></p>
    <p><button id="gotoLogin">ログイン画面へ</button></p>
  </div>

  <!-- ログイン画面 -->
  <div id="loginScreen" style="display:none;">
    <h2>ログイン</h2>
    <input id="loginUser" placeholder="ユーザー名">
    <input id="loginPass" type="password" placeholder="パスワード">
    <button id="loginBtn">ログイン</button>
    <p id="loginError" style="color:red;"></p>
    <p><button id="gotoSignup">新規登録へ</button></p>
  </div>

  <!-- ゲーム画面 -->
  <div id="gameScreen" style="display:none;">
    <h1>クリッカーゲーム</h1>

    <div id="score">0</div>
    <button id="clickBtn">クリック！</button>

    <h2>アップグレード</h2>

    <div class="upgrade">
      <button id="upgradeClick">クリックパワー強化（必要: <span id="costClick">10</span>）</button>
      <div>現在のクリックパワー: <span id="powerClick">1</span></div>
    </div>

    <div class="upgrade">
      <button id="upgradeAuto">オートクリック強化（必要: <span id="costAuto">50</span>）</button>
      <div>毎秒の自動生成: <span id="powerAuto">0</span></div>
    </div>

    <div class="upgrade">
      <button id="upgradeMulti">倍率アップ（必要: <span id="costMulti">200</span>）</button>
      <div>現在の倍率: <span id="multi">1</span>x</div>
    </div>

    <button id="logoutBtn">ログアウト</button>

    <h2>ランキング</h2>
    <div id="rankingList"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
